name: Build Healthy KrishiTech APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/healthy-krishitech-release.jks"
          test -s "$RUNNER_TEMP/healthy-krishitech-release.jks"

      - name: Build signed release APK
        env:
          HK_KEYSTORE_FILE: ${{ runner.temp }}/healthy-krishitech-release.jks
          HK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Healthy-KrishiTech-SIGNED-RELEASE-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
