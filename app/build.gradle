plugins { id 'com.android.application' }

android {
    namespace 'com.healthykrishitech.app'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv('HK_KEYSTORE_FILE') ?: 'healthy-krishitech-release.jks')
            storePassword System.getenv('HK_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('HK_KEY_ALIAS') ?: ''
            keyPassword System.getenv('HK_KEY_PASSWORD') ?: ''
        }
    }

    defaultConfig {
        applicationId 'com.healthykrishitech.app'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.3.2'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}