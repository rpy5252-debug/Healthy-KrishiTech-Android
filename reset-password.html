<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Healthy KrishiTech - Reset Password</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5faf5;color:#123d25;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(94vw,430px);background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #173b2325}h1{font-size:24px;margin:0 0 8px;color:#087533}.sub{margin:0 0 18px;color:#496455}input{width:100%;padding:14px;margin:7px 0;border:1px solid #ccd8d0;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:14px 16px;margin-top:10px;font-weight:700;font-size:16px;background:#087533;color:#fff}.msg{min-height:24px;margin-top:14px;font-size:14px}.ok{color:#087533}.err{color:#a1251b}
</style>
</head>
<body><main class="card">
<h1>Healthy KrishiTech</h1>
<p class="sub">नया पासवर्ड सेट करें</p>
<input id="p1" type="password" minlength="8" autocomplete="new-password" placeholder="नया पासवर्ड (कम से कम 8 अक्षर)">
<input id="p2" type="password" minlength="8" autocomplete="new-password" placeholder="पासवर्ड दोबारा लिखें">
<button id="save">पासवर्ड बदलें</button>
<div id="msg" class="msg"></div>
</main>
<script>
const SB_URL='https://irkbuqavzfajrpuolzid.supabase.co';
const SB_KEY='sb_publishable_dnYAoZd4RFDbWnntZbryAw_IbZOZwIk';
const msg=(t,ok=false)=>{const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')};
function recoveryToken(){
 const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('access_token')) return h.get('access_token');
 const q=new URLSearchParams(location.search);
 if(q.get('access_token')) return q.get('access_token');
 return '';
}
document.getElementById('save').onclick=async()=>{
 try{
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<8) throw Error('पासवर्ड कम से कम 8 अक्षर का रखें।');
  if(p1!==p2) throw Error('दोनों पासवर्ड एक जैसे नहीं हैं।');
  const token=recoveryToken();
  if(!token) throw Error('Reset link अमान्य या expire हो चुका है। ऐप से नया Forgot Password email भेजें।');
  const r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(d.msg||d.message||d.error_description||'Password reset नहीं हुआ।');
  msg('Password सफलतापूर्वक बदल गया। अब Healthy KrishiTech app में नए password से Login करें।',true);
 }catch(e){msg(e.message||String(e))}
};
</script></body></html>
